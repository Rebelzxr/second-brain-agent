<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Second brain agent</title>
<desc id="d">You capture articles and transcripts into the inbox. The digest and compile-wiki skills turn them into linked notes in the wiki. Agents answer your questions from the wiki with citations, and a weekly review turns the week's notes into one page.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Arial,sans-serif;fill:#222724}
.m{font-family:"SF Mono",Menlo,Consolas,monospace}
.g{fill:#6b6e68}.w{fill:#f5f3ed}.v{fill:#6d4bd8}
.card{fill:#fbfaf6;stroke:#222724;stroke-width:2}
.ink{fill:#222724}
.arrow{stroke:#222724;stroke-width:2.5;fill:none}
.link{stroke:#6d4bd8;stroke-width:2;fill:none;stroke-dasharray:6 6}
@keyframes flow{to{stroke-dashoffset:-24}}
.link{animation:flow 1.4s linear infinite}
@media (prefers-reduced-motion:reduce){.link{animation:none}}
</style>
<rect width="1200" height="640" rx="28" fill="#f5f3ed"/>
<text x="60" y="78" font-size="18" letter-spacing="3" fill="#6b6e68" font-weight="700">SECOND BRAIN AGENT</text>
<text x="60" y="128" font-size="40" font-weight="700">Save what you read.</text>
<text x="60" y="176" font-size="40" font-weight="700" class="v">Let agents turn it into knowledge.</text>

<g font-size="20">
  <rect x="60" y="240" width="300" height="150" rx="16" class="ink"/>
  <text x="84" y="282" class="w" font-weight="700">1 · Capture</text>
  <text x="84" y="316" class="w">Web Clipper, transcripts,</text>
  <text x="84" y="342" class="w">exports, notes</text>
  <text x="84" y="372" class="m w" font-size="15">0_Inbox · 1_Raw</text>
  <path d="M372 315 h44 m-12 -12 l12 12 l-12 12" class="arrow"/>

  <rect x="428" y="240" width="330" height="150" rx="16" class="card"/>
  <text x="452" y="282" font-weight="700">2 · Distil</text>
  <text x="452" y="316" class="g">One digest per source,</text>
  <text x="452" y="342" class="g">one note per idea</text>
  <text x="452" y="372" class="m g" font-size="15">digest · compile-wiki</text>
  <path d="M770 315 h44 m-12 -12 l12 12 l-12 12" class="arrow"/>

  <rect x="826" y="240" width="314" height="150" rx="16" fill="#fbfaf6" stroke="#6d4bd8" stroke-width="3"/>
  <text x="850" y="282" font-weight="700" class="v">3 · Linked wiki</text>
  <text x="850" y="316" class="g">Concepts, digests,</text>
  <text x="850" y="342" class="g">decisions, patterns</text>
  <text x="850" y="372" class="m g" font-size="15">2_Wiki · INDEX.md</text>

  <path d="M983 392 V 462" class="link"/>
  <path d="M973 452 l10 12 l10 -12" stroke="#6d4bd8" stroke-width="2.5" fill="none"/>
  <path d="M846 392 C 846 440 812 478 772 490" class="link"/>
  <path d="M784 480 l-12 10 l15 5" stroke="#6d4bd8" stroke-width="2.5" fill="none"/>

  <rect x="428" y="430" width="330" height="150" rx="16" class="card"/>
  <text x="452" y="472" font-weight="700">4 · Ask</text>
  <text x="452" y="506" class="g">Answers from your notes</text>
  <text x="452" y="532" class="g">first, with citations</text>
  <text x="452" y="562" class="m g" font-size="15">ask-brain</text>

  <rect x="826" y="470" width="314" height="110" rx="16" class="card"/>
  <text x="850" y="512" font-weight="700">5 · Review weekly</text>
  <text x="850" y="546" class="m g" font-size="15">weekly-review · 3_Learning</text>

  <rect x="60" y="430" width="300" height="150" rx="16" class="ink"/>
  <text x="84" y="472" class="w" font-weight="700">You</text>
  <text x="84" y="506" class="w">decide what to act on,</text>
  <text x="84" y="532" class="w">keep your own words</text>
  <path d="M416 505 h-44 m12 -12 l-12 12 l12 12" class="arrow"/>
</g>
</svg>
